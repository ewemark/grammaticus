# Render Blueprint — https://render.com/docs/blueprint-spec
# 在 Render 上用 "New +" → "Blueprint" 连接 GitHub 仓库即可自动创建服务。
services:
  - type: web
    name: grammaticus
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # 自动生成随机密钥
      - key: JWT_SECRET
        generateValue: true
      # DeepSeek AI(在 Render 控制台手动填入你的 Key)
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
      # 邮件通知(可选,在控制台手动填)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_TO
        sync: false
